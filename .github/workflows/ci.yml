name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build i testovi (.NET 10)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Postavljanje .NET SDK-a
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: bash
        run: dotnet restore SecureCodingAkademija.sln 2>&1 | tee restore.log

      - name: Build
        shell: bash
        run: dotnet build SecureCodingAkademija.sln -c Release --no-restore 2>&1 | tee build.log

      - name: Anotacije grešaka builda
        if: failure()
        shell: bash
        run: python3 .github/scripts/ci_report.py build restore.log build.log

      - name: Funkcionalni testovi (moraju proći)
        id: functional
        shell: bash
        run: >
          dotnet test SecureCodingAkademija.sln -c Release --no-build
          --filter "Category=Functional"
          --logger "trx;LogFileName=functional.trx"
          --results-directory TestResults

      - name: Sigurnosni testovi (na main grani namjerno padaju)
        id: security
        continue-on-error: ${{ github.ref_name != 'rjesenja' }}
        shell: bash
        run: >
          dotnet test SecureCodingAkademija.sln -c Release --no-build
          --filter "Category=Security"
          --logger "trx;LogFileName=security.trx"
          --results-directory TestResults

      - name: Sažetak po vježbi
        if: always()
        shell: bash
        run: python3 .github/scripts/ci_report.py tests TestResults "${{ github.ref_name }}"

      - name: Spremanje rezultata testova
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            build.log
          if-no-files-found: ignore
